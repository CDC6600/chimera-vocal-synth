[package]
name = "chimera-plugin"
description = "CHIMERA as a CLAP, VST3 and AU instrument: MIDI notes sing the lyrics, with a webview editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
chimera = { path = "../chimera" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false }
clap-wrapper = "=0.3.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "=0.57.1", features = ["devtools"] }
raw-window-handle = "0.6"
